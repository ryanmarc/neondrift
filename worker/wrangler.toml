name = "neondrift-api"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
ALLOWED_ORIGINS = "https://ryanmarc.github.io"

# Local development: `npm run dev` runs `wrangler dev --env dev --ip 0.0.0.0`,
# which listens on the LAN and allows the game served from localhost or from
# any private address (a phone on the same wifi). A plain `wrangler deploy`
# never includes any of this.
[env.dev]
vars = { ALLOWED_ORIGINS = "http://localhost:8000,http://127.0.0.1:8000", ALLOW_LAN = "1" }
d1_databases = [{ binding = "DB", database_name = "neondrift", database_id = "95cd3136-5fd2-4b58-98fd-e2c57d2b7e2e" }]
durable_objects = { bindings = [{ name = "ROOM", class_name = "Room" }] }

[[d1_databases]]
binding = "DB"
database_name = "neondrift"
database_id = "95cd3136-5fd2-4b58-98fd-e2c57d2b7e2e"

# Live mode: one Durable Object per room (worker/src/live.js). Free-plan
# Durable Objects are SQLite-backed, hence new_sqlite_classes.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# 40, not 20: one connect charges this limit twice (/live/join, then the
# GET /live/room/<name> upgrade).
[[unsafe.bindings]]
name = "JOIN_LIMIT"
type = "ratelimit"
namespace_id = "1004"
simple = { limit = 40, period = 60 }

[[unsafe.bindings]]
name = "POST_LIMIT"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[unsafe.bindings]]
name = "CLAIM_LIMIT"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 5, period = 60 }

# The new device polls /pair/poll every 2s (5s after the first minute) while
# its code is showing; 40/min leaves headroom over that without letting a
# script hammer the table.
[[unsafe.bindings]]
name = "POLL_LIMIT"
type = "ratelimit"
namespace_id = "1003"
simple = { limit = 40, period = 60 }
