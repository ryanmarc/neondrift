<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Neon Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#05060b;
    --grid:#101a2e;
    --road:#0a0d18;
    --ice:#2fe3ff;
    --rose:#ff2f9e;
    --amber:#ffc53d;
    --paper:#e8f0ff;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit}
  html,body{height:100%;margin:0;background:var(--void);overflow:hidden}
  body{
    font-family:"Chakra Petch",ui-monospace,"SF Mono",Menlo,monospace;
    color:var(--paper);
    touch-action:none;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{position:relative;width:100%;height:100%;overflow:hidden}
  canvas{display:block;width:100%;height:100%}

  .hud{position:absolute;pointer-events:none;z-index:5;text-shadow:0 0 12px rgba(47,227,255,.5)}

  #topbar{
    top:0;left:0;right:0;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0;
    display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  }
  #clock{font-size:34px;font-weight:700;line-height:.95;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  #lap{font-size:13px;opacity:.65;margin-top:3px;letter-spacing:.06em}
  #rightstack{text-align:right}
  #delta{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;min-height:24px;transition:color .15s}
  #best{font-size:12px;opacity:.55;margin-top:4px;font-variant-numeric:tabular-nums}

  #chain{
    font-size:21px;font-weight:700;line-height:1;
    color:var(--amber);opacity:0;transform-origin:left bottom;
    text-shadow:0 0 18px rgba(255,197,61,.7);
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  #chain.broke{color:var(--rose);text-shadow:0 0 18px rgba(255,47,158,.8)}
  #chainrow{height:24px;display:flex;align-items:flex-end;margin-bottom:9px}
  #meter.snap{box-shadow:0 0 0 1px var(--rose),0 0 18px rgba(255,47,158,.55)}

  #meterwrap{
    left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 26px);
    width:min(260px,62vw);
  }
  #meter{position:relative;height:7px;border-radius:99px;background:rgba(232,240,255,.1);overflow:hidden}
  #fill{height:100%;width:0%;background:var(--ice);border-radius:99px;box-shadow:0 0 14px var(--ice)}
  #fill.hot{background:var(--amber);box-shadow:0 0 20px var(--amber)}
  #meterlabel{text-align:center;font-size:10px;letter-spacing:.24em;opacity:.4;margin-top:7px}

  #countdown{
    position:absolute;top:43%;left:50%;z-index:10;
    font-size:clamp(84px,26vw,152px);font-weight:700;line-height:1;
    color:var(--paper);opacity:0;pointer-events:none;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    text-shadow:0 0 38px rgba(47,227,255,.8),0 0 92px rgba(255,47,158,.45);
  }
  #countdown.go{font-size:clamp(50px,15vw,88px);color:var(--ice);letter-spacing:.1em}

  .btn{
    position:absolute;z-index:8;pointer-events:auto;
    background:rgba(232,240,255,.06);border:1px solid rgba(232,240,255,.16);
    color:var(--paper);border-radius:11px;
    font-family:inherit;font-size:12px;letter-spacing:.06em;
    padding:9px 12px;cursor:pointer;backdrop-filter:blur(6px);
  }
  .btn:active{background:rgba(47,227,255,.2)}
  #restart{top:calc(env(safe-area-inset-top,0px) + 72px);right:16px}
  #camtoggle{top:calc(env(safe-area-inset-top,0px) + 118px);right:16px}
  #mute{top:calc(env(safe-area-inset-top,0px) + 164px);right:16px}
  #guidetoggle{top:calc(env(safe-area-inset-top,0px) + 210px);right:16px}

  #overlay{
    position:absolute;inset:0;z-index:20;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;padding:24px;text-align:center;
    background:radial-gradient(ellipse at 50% 45%,rgba(10,14,28,.82),rgba(5,6,11,.97));
    backdrop-filter:blur(3px);
  }
  #overlay.gone{display:none}
  #title{
    font-size:clamp(44px,15vw,88px);font-weight:700;line-height:.86;
    letter-spacing:-.045em;margin:0;
    color:var(--paper);
    text-shadow:0 0 24px rgba(47,227,255,.75),0 0 60px rgba(255,47,158,.45);
  }
  #seed{font-size:11px;letter-spacing:.3em;opacity:.45;margin-top:14px}
  #seed .override{color:var(--rose);opacity:.9;letter-spacing:.16em}
  #howto{display:flex;flex-direction:column;align-items:center;gap:9px;max-width:37ch;margin:0}
  #rule{
    margin:0;max-width:25ch;
    font-size:17px;line-height:1.45;font-weight:600;color:var(--paper);
    text-wrap:balance;                 /* spreads lines evenly instead of orphaning a word */
  }
  #rule b{color:var(--ice);font-weight:600}
  #aside{margin:0;font-size:13px;opacity:.45;font-style:italic}
  #detail{
    margin:2px 0 0;max-width:35ch;
    font-size:14px;line-height:1.7;opacity:.66;
    text-wrap:pretty;                  /* keeps a lone word off the last line */
  }
  #go{
    pointer-events:auto;margin-top:6px;
    background:transparent;border:1px solid var(--ice);color:var(--ice);
    font-family:inherit;font-size:14px;letter-spacing:.16em;
    padding:14px 34px;border-radius:99px;cursor:pointer;
    box-shadow:0 0 22px rgba(47,227,255,.3),inset 0 0 22px rgba(47,227,255,.09);
  }
  #go:active{background:rgba(47,227,255,.18)}
  #clearghost{
    pointer-events:auto;display:none;
    background:none;border:0;color:var(--paper);opacity:.42;
    font-family:inherit;font-size:12px;letter-spacing:.1em;
    padding:10px 14px;margin-top:-4px;cursor:pointer;
    border-bottom:1px solid rgba(232,240,255,.22);
  }
  #clearghost:active{opacity:.85;color:var(--rose)}
  #result{font-size:15px;line-height:1.7;opacity:.85;min-height:1px}
  #result .big{display:block;font-size:40px;font-weight:700;letter-spacing:-.02em;color:var(--paper);font-variant-numeric:tabular-nums}
  #result .pb{color:var(--amber)}
  #result .faster{color:var(--ice);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(47,227,255,.55)}
  #result .slower{color:var(--rose);font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,47,158,.5)}
  #result .note{opacity:.55}
  /* DEV PANEL CSS START — delete with the dev panel */
  #devpanel{
    pointer-events:auto;margin-top:6px;padding:12px 14px;
    border:1px dashed rgba(232,240,255,.18);border-radius:12px;
    display:flex;flex-direction:column;gap:10px;align-items:stretch;
    max-width:300px;width:100%;
  }
  #devpanel label{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.6;cursor:pointer}
  #devpanel input[type=checkbox]{accent-color:var(--ice);width:15px;height:15px}
  #devSeedRow{display:flex;gap:6px}
  #devSeed{
    flex:1;min-width:0;background:rgba(232,240,255,.06);
    border:1px solid rgba(232,240,255,.18);border-radius:8px;color:var(--paper);
    font-family:inherit;font-size:12px;padding:8px 10px;
  }
  #devSeed:focus{outline:none;border-color:var(--ice)}
  #devpanel button{
    background:rgba(232,240,255,.08);border:1px solid rgba(232,240,255,.18);
    color:var(--paper);border-radius:8px;font-family:inherit;font-size:12px;
    padding:8px 11px;cursor:pointer;
  }
  #devpanel button:active{background:rgba(47,227,255,.2)}
  /* DEV PANEL CSS END */

  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>

  <div class="hud" id="topbar">
    <div>
      <div id="clock">0.00</div>
      <div id="lap">Lap 1 of 3</div>
    </div>
    <div id="rightstack">
      <div id="delta"></div>
      <div id="best"></div>
    </div>
  </div>

  <div class="hud" id="meterwrap">
    <div id="chainrow"><div id="chain"></div></div>
    <div id="meter"><div id="fill"></div></div>
    <div id="meterlabel">BOOST</div>
  </div>

  <div id="countdown"></div>

  <button class="btn" id="restart">Restart</button>
  <button class="btn" id="camtoggle">Camera: fixed</button>
  <button class="btn" id="mute">Sound: on</button>
  <button class="btn" id="guidetoggle">Guides: on</button>

  <div id="overlay">
    <div>
      <h1 id="title">NEON<br>DRIFT</h1>
      <div id="seed"></div>
    </div>
    <div id="howto">
      <p id="rule">Hold <b>either side</b> of the screen to turn.</p>
      <p id="aside">That's the whole game.</p>
      <p id="detail">Keep holding and the back steps out. Sliding costs you speed but fills the boost meter. Let go and the car straightens itself, spending whatever boost you earned.</p>
    </div>
    <div id="result"></div>
    <button id="go">TAP TO RACE</button>
    <button id="clearghost">Clear saved ghost</button>

    <!-- DEV PANEL START — temporary test controls. To remove: delete this block,
         the #devpanel CSS block, and the DEV PANEL script block at the end. -->
    <div id="devpanel">
      <label id="devGuidesRow"><input type="checkbox" id="devGuides"> Show drift guides</label>
      <div id="devSeedRow">
        <input type="text" id="devSeed" placeholder="seed" autocomplete="off" spellcheck="false">
        <button id="devLoad" type="button">Load</button>
        <button id="devRandom" type="button">Random</button>
      </div>
    </div>
    <!-- DEV PANEL END -->
  </div>
</div>

<script>
(() => {
"use strict";

// ---------- helpers ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

const QS = new URLSearchParams(location.search);
const now = new Date();
const TODAY = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
// ?seed=2026-12-25 forces that day's track. ?seed=random gives a fresh one every
// load. Any string works — it's only ever used as a seed, so ?seed=abc is valid too.
const SEED_PARAM = QS.get("seed");
const SEED_OVERRIDE = SEED_PARAM!=null && SEED_PARAM!=="";
const INITIAL_SEED = !SEED_OVERRIDE ? TODAY
  : (SEED_PARAM==="random" ? "rnd-"+Math.random().toString(36).slice(2,10) : SEED_PARAM);
let SEED_STR, rng;

// ---------- track ----------
const LAPS=3, ROAD_W=264, HALF=ROAD_W/2, STEP=12;

function trackFromAmps(R0, amps){
  const M=4000, raw=[];
  for(let i=0;i<M;i++){
    const th=i/M*TAU;
    let m=1;
    for(const h of amps) m += h.a*Math.sin(h.k*th+h.p);
    const r=R0*m;
    raw.push({x:Math.cos(th)*r, y:Math.sin(th)*r});
  }
  let total=0; const cum=[0];
  for(let i=1;i<=M;i++){ const a=raw[i-1],b=raw[i%M]; total+=Math.hypot(b.x-a.x,b.y-a.y); cum.push(total); }
  const count=Math.max(500,Math.round(total/STEP));
  const S=[]; let j=0;
  for(let i=0;i<count;i++){
    const d=i/count*total;
    while(j<M-1 && cum[j+1]<d) j++;
    const seg=cum[j+1]-cum[j]||1, t=(d-cum[j])/seg;
    const a=raw[j], b=raw[(j+1)%M];
    S.push({x:lerp(a.x,b.x,t), y:lerp(a.y,b.y,t)});
  }
  for(let i=0;i<S.length;i++){
    const a=S[(i-1+S.length)%S.length], b=S[(i+1)%S.length];
    let tx=b.x-a.x, ty=b.y-a.y; const L=Math.hypot(tx,ty)||1; tx/=L; ty/=L;
    S[i].tx=tx; S[i].ty=ty; S[i].nx=-ty; S[i].ny=tx;
  }
  // curvature: how tight, and how often the turn direction flips
  let minR=1e9, flips=0, prev=0;
  for(let i=0;i<S.length;i++){
    const a=S[i], b=S[(i+1)%S.length];
    let d=Math.atan2(b.ty,b.tx)-Math.atan2(a.ty,a.tx);
    while(d>Math.PI)d-=TAU; while(d<-Math.PI)d+=TAU;
    S[i].curv=d;
    if(Math.abs(d)>1e-4) minR=Math.min(minR, STEP/Math.abs(d));
    const s=Math.abs(d)>0.0045?Math.sign(d):0;
    if(s && prev && s!==prev) flips++;
    if(s) prev=s;
  }
  return {S, length:total, minR, flips};
}

function buildTrack(){
  const R0=1080+rng()*470;
  let fallback=null;
  for(let attempt=0;attempt<24;attempt++){
    const pool=[2,3,4,5,6,7];
    for(let i=pool.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    // always keep a mid harmonic — that's what creates reverse-curvature corners
    const anchor = rng()<0.5?3:4;
    const ks=[anchor, ...pool.filter(k=>k!==anchor)].slice(0, 3+Math.floor(rng()*3));
    const base=ks.map(k=>({k, a:(0.6+rng()*0.9)/Math.sqrt(k), p:rng()*TAU}));
    const sum=base.reduce((s,h)=>s+Math.abs(h.a),0);
    let scale=0.46/sum;
    for(let shrink=0;shrink<9;shrink++){
      // shrink tight high harmonics faster than the broad shape-defining ones
      const amps=base.map(h=>({k:h.k, a:h.a*scale*Math.pow(scale<1?0.95:1, Math.max(0,h.k-4)*shrink), p:h.p}));
      const t=trackFromAmps(R0, amps);
      if(t.minR>185 && t.flips>=4) return t;
      if(!fallback || (t.flips>fallback.flips && t.minR>170)) fallback=t;
      scale*=0.90;
    }
  }
  return fallback;
}
let TRACK, S, N;

// Identify the track by its actual shape, so a ghost is only ever replayed on the
// track it was set on — different day, different layout, or a changed generator all
// produce a different id and simply have no ghost yet.
let TRACK_ID;
function hashTrack(){
  let h=2166136261;
  for(let i=0;i<N;i+=17){
    h^=Math.round(S[i].x)|0; h=Math.imul(h,16777619);
    h^=Math.round(S[i].y)|0; h=Math.imul(h,16777619);
  }
  h^=N; h=Math.imul(h,16777619);
  return (h>>>0).toString(36);
}

// ---------- tuning ----------
const T = {
  accel:1040, maxSpeed:690, boostSpeed:945, boostAccel:1560,
  turn:3.15, zeta:0.45,       // steering rate, and yaw damping ratio (lower = more overshoot)
  align:11,                   // self-aligning torque gain
  alignFall:0.75,             // slip angle (rad) past which the restoring force fades
  alignFloor:0.40,            // how much restoring force survives at big angles
  stiffness:13,               // lateral correction rate while the tires still bite
  gripMax:1150,               // max lateral accel with grip (px/s^2)
  gripSlide:260,              // max lateral accel once traction breaks
  chargeUp:0.24, chargeDown:0.45,
  driftMin:0.13, scrub:1000, slipCost:0.26,
  slipLagIn:0.22,             // seconds to bleed speed off as a slide builds
  slipLagOut:0.45,            // seconds to gather it back up as the car straightens
  boostCap:1.0, boostDrain:0.46, boostFill:0.60,
  offDrag:2.2,
  zoomRange:0.045,            // how far the view pulls back at full speed
  zoomLag:0.60                // seconds for the zoom to follow a speed change
};

// ---------- state ----------
const car={x:0,y:0,a:0,av:0,vx:0,vy:0,idx:0,prog:0,lap:1,drift:0,charge:0,boost:0,boosting:false,mult:1,off:false,slipSm:0,px:0,py:0,pa:0};
let time=0, running=false, finished=false, marks=[], rec=[], recAcc=0, chainFlash=0, shake=0, breakT=0, lostMult=1;
let trail=[], trailAcc=0;
let ghost=null, bestTime=null, camRot=false;

let LS_BEST, LS_GHOST;
// Builds everything that depends on the seed. Called once at startup, and again
// whenever a new seed is entered, so the track can change without a page reload.
function loadTrack(seed){
  SEED_STR=seed;
  rng=mulberry32(hashStr(SEED_STR));
  TRACK=buildTrack(); S=TRACK.S; N=S.length;
  TRACK_ID=hashTrack();
  LS_BEST="neondrift:t"+TRACK_ID+":best";
  LS_GHOST="neondrift:t"+TRACK_ID+":ghost";
  ghost=null; bestTime=null;
  try{
    const b=localStorage.getItem(LS_BEST); if(b) bestTime=parseFloat(b);
    const g=localStorage.getItem(LS_GHOST); if(g) ghost=JSON.parse(g);
  }catch(e){}
  GUIDES=buildGuides();
  if(typeof refreshSeedUI==="function") refreshSeedUI();
}

function resetCar(){
  const s=S[0];
  car.x=s.x; car.y=s.y; car.a=Math.atan2(s.ty,s.tx); car.av=0;
  car.px=car.x; car.py=car.y; car.pa=car.a;
  car.vx=0; car.vy=0; car.idx=0; car.prog=0; car.lap=1;
  car.drift=0; car.charge=0; car.boost=0; car.boosting=false; car.mult=1; car.slipSm=0; car.off=false;
  time=0; finished=false; marks=[]; rec=[]; recAcc=0; chainFlash=0; shake=0; breakT=0; lostMult=1;
  trail=[]; trailAcc=0;
}

// ---------- input ----------
let hL=false,hR=false;
const stage=document.getElementById("stage");
const ptr=new Map();
function refresh(){
  hL=false;hR=false;
  for(const side of ptr.values()){ if(side<0)hL=true; else hR=true; }
}
stage.addEventListener("pointerdown",e=>{
  if(e.target.tagName==="BUTTON")return;
  if(e.target.closest&&e.target.closest("#overlay"))return;   // menu/panel taps aren't steering
  ptr.set(e.pointerId, e.clientX < window.innerWidth/2 ? -1 : 1); refresh();
  // steering by touch OR by clicking the halves both make the on-screen hint correct
  if(typeof setRule==="function") setRule("pointer");
},{passive:true});
const up=e=>{ptr.delete(e.pointerId);refresh()};
stage.addEventListener("pointerup",up,{passive:true});
stage.addEventListener("pointercancel",up,{passive:true});
stage.addEventListener("pointerleave",up,{passive:true});
addEventListener("keydown",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")hL=true;
  if(e.key==="ArrowRight"||e.key==="d")hR=true;
  if(e.key==="r"||e.key==="R")start();
});
addEventListener("keyup",e=>{
  if(e.key==="ArrowLeft"||e.key==="a")hL=false;
  if(e.key==="ArrowRight"||e.key==="d")hR=false;
});
const steer=()=> (hL&&hR)?0 : hL?-1 : hR?1 : 0;

// ---------- track queries ----------
function nearest(px,py,from){
  let bi=from,bd=1e18;
  for(let k=-45;k<=45;k++){
    const i=((from+k)%N+N)%N;
    const a=S[i], b=S[(i+1)%N];
    const dx=b.x-a.x, dy=b.y-a.y, L2=dx*dx+dy*dy||1;
    let t=((px-a.x)*dx+(py-a.y)*dy)/L2; t=clamp(t,0,1);
    const qx=a.x+dx*t, qy=a.y+dy*t;
    const d=(px-qx)**2+(py-qy)**2;
    if(d<bd){bd=d;bi=i}
  }
  return {i:bi, dist:Math.sqrt(bd)};
}

// ---------- physics ----------
function step(dt){
  car.px=car.x; car.py=car.y; car.pa=car.a;   // previous state, for render interpolation
  const inp=steer();

  if(inp!==0) car.charge=Math.min(1,car.charge+dt/T.chargeUp);
  else car.charge=Math.max(0,car.charge-dt/T.chargeDown);

  const speed=Math.hypot(car.vx,car.vy);
  const turnScale=Math.min(1,speed/175);

  // --- yaw: the nose has inertia, and it self-aligns toward the direction of travel
  {
    const hx0=Math.cos(car.a), hy0=Math.sin(car.a);
    const f0=car.vx*hx0+car.vy*hy0, l0=car.vx*-hy0+car.vy*hx0;
    const beta0=Math.atan2(l0,Math.max(Math.abs(f0),50));
    // Real tires don't restore harder the more sideways you get — the aligning force
    // peaks near the grip limit, then fades. That fade is what lets a drift hold.
    const ab=Math.abs(beta0), sn=Math.sin(ab);
    let shape=Math.max(sn*Math.exp(-ab/T.alignFall), sn*T.alignFloor)*Math.sign(beta0);
    shape *= 1 + Math.max(0,ab-1.25)*4;   // only gather it up once you're truly spinning
    // Second-order yaw: the aligning force is a TORQUE on a body with inertia, damped
    // separately — so the nose can swing slightly past straight and come back, which a
    // first-order system mathematically cannot do. om is derived from align and zeta so
    // the settled drift angle is unchanged; zeta alone controls the settling character.
    const w=(inp===0?0.90:0.50)*clamp(speed/240,0,1);
    const om=2*T.zeta*T.align, damp=2*T.zeta*om;
    const yawAcc = om*om*shape*w - damp*car.av + inp*T.turn*turnScale*damp;
    car.av += yawAcc*dt;
    car.a += car.av*dt;
  }

  const hx=Math.cos(car.a), hy=Math.sin(car.a);
  let fwd=car.vx*hx+car.vy*hy;
  let lat=car.vx*-hy+car.vy*hx;

  // auto-boost on the straights
  // No threshold: any charge fires as soon as you stop steering. Small drifts give
  // small shoves, which is honest — and it means the meter never holds anything
  // you can't spend.
  const wasBoost=car.boosting;
  car.boosting = inp===0 && car.boost>0 && speed>140;
  if(car.boosting && !wasBoost) SFX.boost();
  if(car.boosting) car.boost=Math.max(0,car.boost-T.boostDrain*dt);

  const top = (car.boosting?T.boostSpeed:T.maxSpeed) * (car.off?0.52:1);
  const acc = car.boosting?T.boostAccel:T.accel;
  fwd += acc*dt;
  if(fwd>top) fwd=lerp(fwd,top,1-Math.exp(-6*dt));
  // sliding sideways scrubs speed — that's the cost of drifting
  fwd *= Math.exp(-((car.off?T.offDrag:0.30) + Math.abs(lat)/T.scrub)*dt);

  // --- friction circle: grip can only correct so much sideways motion per second.
  // Holding the turn breaks traction (lower ceiling); releasing restores the ceiling
  // but the slide already in the car still has to bleed off, so it persists.
  const latMax = lerp(T.gripMax, T.gripSlide, car.charge) * (car.off?0.45:1);
  const corr = Math.min(Math.abs(lat)*T.stiffness, latMax)*dt;
  lat -= Math.sign(lat)*Math.min(Math.abs(lat), corr);

  car.vx=hx*fwd+-hy*lat; car.vy=hy*fwd+hx*lat;

  // Tires scrub speed away faster than the engine can put it back, so losing speed
  // into a slide and regaining it on exit run on different clocks.
  const beta=Math.atan2(lat,Math.max(Math.abs(fwd),50));
  const slipT=Math.abs(Math.sin(beta));
  const slipLag = slipT>car.slipSm ? T.slipLagIn : T.slipLagOut;
  car.slipSm += (slipT-car.slipSm)*(1-Math.exp(-dt/slipLag));
  const cap=top*(1-T.slipCost*car.slipSm);
  const tot=Math.hypot(car.vx,car.vy);
  if(tot>cap){ const k=cap/tot; car.vx*=k; car.vy*=k; }

  car.x+=car.vx*dt; car.y+=car.vy*dt;

  car.drift=Math.abs(beta);

  // track relationship
  const near=nearest(car.x,car.y,car.idx);
  const prevP=car.idx/N;
  car.idx=near.i;
  const p=car.idx/N;
  if(prevP>0.86 && p<0.14) car.lap++;
  else if(prevP<0.14 && p>0.86) car.lap--;
  car.prog=p;

  const wasOff=car.off;
  car.off = near.dist > HALF;
  if(car.off && !wasOff){
    if(car.mult>1.4){ lostMult=car.mult; breakT=1; SFX.chainBreak(); }
    car.mult=1; shake=Math.min(1,speed/600); chainFlash=0;
    SFX.limit(clamp(speed/T.maxSpeed,0,1));
  }

  // drifting fills boost
  const sliding = car.drift>T.driftMin && speed>210 && !car.off;
  if(sliding){
    car.boost=Math.min(T.boostCap, car.boost + dt*car.drift*(speed/T.maxSpeed)*T.boostFill*car.mult);
    car.mult=Math.min(4, car.mult + dt*0.30);
    if(marks.length<1400 && Math.random()<0.75){
      marks.push({x:car.x,y:car.y,a:car.a,l:1});
    }
    chainFlash=1;
  }else if(!car.off){
    car.mult=Math.max(1, car.mult - dt*0.10);
  }

  // Exhaust is dropped in world space at the tailpipe and left there, so the plume
  // bends with the car's path instead of pointing wherever the nose happens to face.
  trailAcc+=dt;
  if(trailAcc>=1/70){
    trailAcc-=1/70;
    const th=Math.cos(car.a), tv=Math.sin(car.a);
    trail.push({x:car.x-th*15, y:car.y-tv*15, l:1, hot:car.boosting?1:0});
    if(trail.length>34) trail.shift();
  }
  for(const p of trail) p.l-=dt*3.2;
  while(trail.length && trail[0].l<=0) trail.shift();

  for(let i=marks.length-1;i>=0;i--){ marks[i].l-=dt*0.055; if(marks[i].l<=0) marks.splice(i,1); }
  shake=Math.max(0,shake-dt*2.5);
  chainFlash=Math.max(0,chainFlash-dt*1.8);
  breakT=Math.max(0,breakT-dt*1.1);

  // ghost recording @30Hz
  recAcc+=dt;
  if(recAcc>=1/30){ recAcc-=1/30; rec.push(+car.x.toFixed(1),+car.y.toFixed(1),+car.a.toFixed(3),+(car.lap-1+p).toFixed(4)); }

  time+=dt;
  if(car.lap>LAPS) finish();
}

function ghostAt(t){
  if(!ghost) return null;
  const f=t*30, i=Math.floor(f);
  if(i>=ghost.length/4-1) return null;
  const k=f-i, o=i*4, o2=o+4;
  return {x:lerp(ghost[o],ghost[o2],k), y:lerp(ghost[o+1],ghost[o2+1],k), a:ghost[o+2]};
}
function ghostTimeAtProgress(pr){
  if(!ghost) return null;
  const frames=ghost.length/4;
  for(let i=1;i<frames;i++){
    const a=ghost[(i-1)*4+3], b=ghost[i*4+3];
    if(b>=pr){ const t=(pr-a)/((b-a)||1); return (i-1+t)/30; }
  }
  return null;
}

// ---------- render ----------
const cv=document.getElementById("c"), cx=cv.getContext("2d");
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=stage.clientWidth; H=stage.clientHeight;
  cv.width=W*DPR; cv.height=H*DPR;
  cx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);

// Chase camera feel. face: 0 = follow direction of travel only, 1 = follow the nose.
// freq: how stiff the spring is (lower = looser, laggier). zeta: damping — below 1
// the camera overshoots slightly and swings back, which is the elasticity.
const CAM = { face:0.12, freq:3.8, zeta:0.80, leadLag:0.35 };
const cam={x:0,y:0,a:0,z:1};
let camAV=0, camLX=0, camLY=0;

  // --- Drift guides -----------------------------------------------------------
// Heuristic, not a solved optimum. Corners come from the track's own curvature.
// The lead/trail distances come from the car's measured response: a slide takes
// about chargeUp+yaw time to build, and about slipLagOut to gather back up, so
// you commit before the corner starts and release before it ends.
const GUIDE = { minRadius:520, lead:0.34, trail:0.42, minCorner:120 };

function buildGuides(){
  const cur=new Float32Array(N);
  for(let i=0;i<N;i++){                       // smooth out sampling noise
    let s=0; for(let k=-8;k<=8;k++) s+=S[((i+k)%N+N)%N].curv;
    cur[i]=s/17;
  }
  const thr=STEP/GUIDE.minRadius;             // curvature of the tightest free-flowing corner
  const cruise=T.maxSpeed*0.85;
  const leadN=Math.round(cruise*GUIDE.lead/STEP);
  const trailN=Math.round(cruise*GUIDE.trail/STEP);
  const out=[]; let i=0;
  while(i<N){
    if(Math.abs(cur[i])>thr){
      const sign=Math.sign(cur[i]); let j=i;
      while(j-i<N && Math.abs(cur[j%N])>thr*0.5 && Math.sign(cur[j%N])===sign) j++;
      if((j-i)*STEP>GUIDE.minCorner){
        out.push({ a:((i-leadN)%N+N)%N, b:((j-trailN)%N+N)%N, dir:sign });
      }
      i=j;
    } else i++;
  }
  return out;
}
// FEATURE FLAG: drift guide markers. Off by default. Flip to true here to bring
// them back (which also restores the on-screen toggle button), or append ?guides
// to the page URL to enable them without editing this file.
const GUIDES_ENABLED = false || QS.has("guides");
let GUIDES = [];
let guidesOn = GUIDES_ENABLED;

function drawGuide(idx,col,dashed){
  const s=S[idx];
  cx.save();
  cx.strokeStyle=col; cx.lineWidth=4; cx.shadowColor=col; cx.shadowBlur=14;
  if(dashed) cx.setLineDash([15,11]);
  cx.beginPath();
  cx.moveTo(s.x+s.nx*HALF, s.y+s.ny*HALF);
  cx.lineTo(s.x-s.nx*HALF, s.y-s.ny*HALF);
  cx.stroke();
  cx.restore();
}


function draw(){
  // Physics runs at a fixed 120Hz but the display may not be a multiple of that,
  // so render a position interpolated between the last two steps. Without this,
  // a 144Hz screen shows 0.83 steps per frame and the car visibly stutters.
  const alpha = (running && cd<=0) ? clamp(acc/(1/120),0,1) : 1;
  const rx=lerp(car.px,car.x,alpha), ry=lerp(car.py,car.y,alpha);
  let dA=car.a-car.pa; while(dA>Math.PI)dA-=TAU; while(dA<-Math.PI)dA+=TAU;
  const ra=car.pa+dA*alpha;

  // Show more of the world on a bigger viewport. Mapping a fixed world span to the
  // short edge made everything huge on desktop; the clamp leaves phones untouched.
  const vmin=Math.min(W,H);
  const span = (camRot ? 980 : 1080) * clamp(vmin/420,1,1.85);
  // Zoom tracks actual speed on a slow lag, rather than stepping the moment boost
  // toggles — a binary flag made the view pop in and out at the ends of every boost.
  const sp=Math.hypot(car.vx,car.vy);
  const lo=T.maxSpeed*0.55, hi=T.boostSpeed;
  const t=clamp((sp-lo)/(hi-lo),0,1);
  const targetZ = vmin/span * (1-T.zoomRange*t);
  cam.z += (targetZ-cam.z)*(1-Math.exp(-frameDt/T.zoomLag));

  const lead = camRot?0.30:0.36;
  // The look-ahead is velocity * lead, and velocity swings hard the moment a slide
  // starts — which yanked the camera's aim point backwards and made the pan stall
  // on every tap. Smooth the look-ahead vector itself so the target moves evenly.
  const lk=1-Math.exp(-frameDt/CAM.leadLag);
  camLX += (car.vx*lead-camLX)*lk;
  camLY += (car.vy*lead-camLY)*lk;
  const tx=rx+camLX, ty=ry+camLY;
  // framerate-independent follow, so a 144Hz screen doesn't track tighter than 60Hz
  const fk=1-Math.exp(-frameDt/0.11);
  cam.x=lerp(cam.x,tx,fk); cam.y=lerp(cam.y,ty,fk);
  // Chase camera: aimed mostly at where the car is TRAVELLING, not where its nose
  // points, so a drift doesn't whip the view around. Held by a spring, so it trails
  // and settles rather than being welded to the car.
  let camTarget=0;
  if(camRot){
    const vmag=Math.hypot(car.vx,car.vy);
    const travel = vmag>60 ? Math.atan2(car.vy,car.vx) : ra;
    let nose=ra-travel;
    while(nose>Math.PI)nose-=TAU; while(nose<-Math.PI)nose+=TAU;
    camTarget = -(travel + nose*CAM.face) - Math.PI/2;
  }
  let err=camTarget-cam.a;
  while(err>Math.PI)err-=TAU; while(err<-Math.PI)err+=TAU;
  const cdt=Math.min(frameDt,1/30);
  camAV += (CAM.freq*CAM.freq*err - 2*CAM.zeta*CAM.freq*camAV)*cdt;
  cam.a += camAV*cdt;

  cx.fillStyle="#05060b"; cx.fillRect(0,0,W,H);

  cx.save();
  const sx=(Math.random()-0.5)*shake*14, sy=(Math.random()-0.5)*shake*14;
  cx.translate(W/2+sx, camRot?H*0.66+sy:H/2+sy);
  cx.rotate(cam.a); cx.scale(cam.z,cam.z); cx.translate(-cam.x,-cam.y);

  // visible bounds in world space
  const r=Math.hypot(W,H)/cam.z/2+260;
  const bx0=cam.x-r,bx1=cam.x+r,by0=cam.y-r,by1=cam.y+r;

  // grid
  const g=260;
  cx.lineWidth=1/cam.z; cx.strokeStyle="#101a2e"; cx.beginPath();
  for(let gx=Math.floor(bx0/g)*g; gx<bx1; gx+=g){ cx.moveTo(gx,by0); cx.lineTo(gx,by1); }
  for(let gy=Math.floor(by0/g)*g; gy<by1; gy+=g){ cx.moveTo(bx0,gy); cx.lineTo(bx1,gy); }
  cx.stroke();

  // visible runs of track
  const runs=[]; let cur=null;
  for(let i=0;i<=N;i++){
    const s=S[i%N];
    const vis = s.x>bx0&&s.x<bx1&&s.y>by0&&s.y<by1;
    if(vis){ if(!cur){cur=[];runs.push(cur)} cur.push(s); }
    else if(cur){ cur.push(s); cur=null; }
  }

  // road surface
  cx.lineCap="round"; cx.lineJoin="round";
  cx.strokeStyle="#0a0d18"; cx.lineWidth=ROAD_W;
  for(const run of runs){ if(run.length<2)continue; cx.beginPath(); cx.moveTo(run[0].x,run[0].y); for(let i=1;i<run.length;i++)cx.lineTo(run[i].x,run[i].y); cx.stroke(); }

  // tire marks
  if(marks.length){
    cx.lineWidth=8; cx.strokeStyle="rgba(165,190,245,.16)"; cx.beginPath();
    for(const m of marks){
      if(m.x<bx0||m.x>bx1||m.y<by0||m.y>by1)continue;
      const nx=-Math.sin(m.a)*11, ny=Math.cos(m.a)*11;
      cx.moveTo(m.x+nx,m.y+ny); cx.lineTo(m.x+nx*0.2,m.y+ny*0.2);
      cx.moveTo(m.x-nx,m.y-ny); cx.lineTo(m.x-nx*0.2,m.y-ny*0.2);
    }
    cx.stroke();
  }

  // glowing edges
  cx.shadowBlur=22/cam.z*cam.z; cx.lineWidth=4;
  for(const [sign,col] of [[1,"#2fe3ff"],[-1,"#ff2f9e"]]){
    cx.strokeStyle=col; cx.shadowColor=col; cx.shadowBlur=18;
    for(const run of runs){
      if(run.length<2)continue;
      cx.beginPath();
      for(let i=0;i<run.length;i++){
        const s=run[i], X=s.x+s.nx*HALF*sign, Y=s.y+s.ny*HALF*sign;
        i?cx.lineTo(X,Y):cx.moveTo(X,Y);
      }
      cx.stroke();
    }
  }
  cx.shadowBlur=0;

  // drift guides, drawn on the road under everything else
  if(guidesOn){
    for(const g of GUIDES){
      const sa=S[g.a], sb=S[g.b];
      if(sa.x>bx0&&sa.x<bx1&&sa.y>by0&&sa.y<by1) drawGuide(g.a,"#49ff9e",false);
      if(sb.x>bx0&&sb.x<bx1&&sb.y>by0&&sb.y<by1) drawGuide(g.b,"#e8f0ff",true);
    }
  }

  // start / finish
  const s0=S[0];
  cx.save(); cx.translate(s0.x,s0.y); cx.rotate(Math.atan2(s0.ty,s0.tx));
  cx.fillStyle="rgba(232,240,255,.16)"; cx.fillRect(-5,-HALF,10,ROAD_W);
  cx.restore();

  // ghost
  const gp=ghostAt(time);
  if(gp) drawCar(gp.x,gp.y,gp.a,"rgba(47,227,255,.30)","rgba(47,227,255,.07)",true);

  // tapered plume along the path actually travelled
  if(trail.length>1){
    cx.lineCap="round"; cx.lineJoin="round";
    for(let pass=0;pass<2;pass++){           // wide soft pass, then a tight bright core
      const wide=pass===0;
      for(let i=1;i<trail.length;i++){
        const a=trail[i-1], b=trail[i];
        if(!b.hot) continue;
        const t=i/(trail.length-1);          // 0 at the tail, 1 at the tailpipe
        const life=clamp(b.l,0,1);
        const alpha=(wide?0.16:0.5)*life*life*t;
        if(alpha<0.01) continue;
        cx.strokeStyle="rgba(255,197,61,"+alpha.toFixed(3)+")";
        cx.lineWidth=(3+16*t)*(wide?2.4:1);
        cx.beginPath(); cx.moveTo(a.x,a.y); cx.lineTo(b.x,b.y); cx.stroke();
      }
    }
  }

  drawCar(rx,ry,ra,"#e8f0ff", car.boosting?"#ffc53d":"#2fe3ff",false);
  cx.restore();

  if(car.off){
    cx.fillStyle="rgba(255,47,158,.10)"; cx.fillRect(0,0,W,H);
  }
}

function drawCar(x,y,a,body,glow,isGhost){
  cx.save(); cx.translate(x,y); cx.rotate(a);
  cx.shadowColor=glow; cx.shadowBlur=isGhost?10:26;
  cx.fillStyle=body;
  cx.beginPath();
  cx.moveTo(24,0); cx.lineTo(4,11); cx.lineTo(-20,9);
  cx.lineTo(-20,-9); cx.lineTo(4,-11); cx.closePath(); cx.fill();
  cx.shadowBlur=0;
  if(!isGhost){ cx.fillStyle="rgba(5,6,11,.65)"; cx.fillRect(-6,-6,11,12); }
  cx.restore();
}

// Which control hint to show. Rather than sniffing the user agent (which gets
// touchscreen laptops and keyboard tablets wrong), start from a capability query

const $rule=document.getElementById("rule");

function setRule(mode){
  if(mode && mode===inputMode) return;
  if(mode) inputMode=mode;
  $rule.innerHTML = inputMode==="pointer"
    ? 'Hold <b>either side</b> of the screen to turn.'
    : 'Hold the <b>left or right arrow key</b> to turn.';
}

const $clear=document.getElementById("clearghost");

$clear.addEventListener("click",e=>{
  e.stopPropagation();
  ghost=null; bestTime=null;
  try{ localStorage.removeItem(LS_BEST); localStorage.removeItem(LS_GHOST); }catch(err){}
  $result.innerHTML="Ghost and best time cleared. Next run sets the new pace.";
  syncClear();
});

function hud(){
  $clock.textContent=fmt(time);
  $lap.textContent="Lap "+clamp(car.lap,1,LAPS)+" of "+LAPS;
  // the fill carries a glow, so at width 0 it still smears; hide it outright when empty
  $fill.style.width=(car.boost*100)+"%";
  $fill.style.opacity = car.boost<0.004 ? "0" : "1";
  $fill.classList.toggle("hot",car.boosting);
  $best.textContent = bestTime!=null ? "Best "+fmt(bestTime) : "";

  const gt=ghostTimeAtProgress(car.lap-1+car.prog);
  if(gt!=null && running && cd<=0){
    const d=time-gt;
    $delta.textContent=(d>=0?"+":"")+d.toFixed(2);
    $delta.style.color = d<0 ? "#2fe3ff" : "#ff2f9e";
  } else $delta.textContent="";

  if(breakT>0){
    $chain.textContent="×"+lostMult.toFixed(1)+" LOST";
    $chain.className="broke";
    $chain.style.opacity=Math.min(1,breakT*1.8).toFixed(2);
    $chain.style.transform="scale("+(1+0.14*breakT).toFixed(3)+")";
    $meter.classList.toggle("snap", breakT>0.55);
  } else if(car.mult>1.05){
    // stays on screen the whole time you're chained, so you can watch it build
    const t=clamp((car.mult-1)/3,0,1);
    $chain.textContent="×"+car.mult.toFixed(1);
    $chain.className="";
    $chain.style.opacity=(0.40+0.60*t).toFixed(2);
    $chain.style.transform="scale("+(1+0.16*t).toFixed(3)+")";
    $meter.classList.remove("snap");
  } else {
    $chain.style.opacity=0;
    $meter.classList.remove("snap");
  }
}

// ===== SOUND ================================================================
// Tire skid, off-track rumble, and the combo-lost cue. Self-contained and safe
// to delete: every call site starts with "SFX." and nothing is loaded from disk.
const SFX=(()=>{
  let ctx=null, master=null, noiseBuf=null, noiseSrc=null;
  let squealF=null, squealG=null, harmF=null, harmG=null, scrubF=null, scrubG=null;
  let offF=null, offG=null, airF=null, airG=null, lfo=null, lfoG=null;
  let ready=false, muted=false;
  try{ muted = localStorage.getItem("neondrift:mute")==="1"; }catch(e){}

  function init(){
    if(ctx) return;
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return;
    ctx=new AC();
    master=ctx.createGain(); master.gain.value=muted?0:0.9; master.connect(ctx.destination);

    const len=Math.floor(ctx.sampleRate*2);
    noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    noiseSrc=ctx.createBufferSource(); noiseSrc.buffer=noiseBuf; noiseSrc.loop=true;

    // Squeal: a tire doesn't hiss, it rings. Stick-slip in the tread gives a narrow
    // resonant tone, so this is a very high-Q bandpass rather than a broad filter.
    squealF=ctx.createBiquadFilter(); squealF.type="bandpass";
    squealF.frequency.value=900; squealF.Q.value=12;
    squealG=ctx.createGain(); squealG.gain.value=0;
    noiseSrc.connect(squealF); squealF.connect(squealG); squealG.connect(master);

    // a harmonic above it, so the tone has body instead of sounding like a test tone
    harmF=ctx.createBiquadFilter(); harmF.type="bandpass";
    harmF.frequency.value=1850; harmF.Q.value=7;
    harmG=ctx.createGain(); harmG.gain.value=0;
    noiseSrc.connect(harmF); harmF.connect(harmG); harmG.connect(master);

    // low scrubbing roar under the squeal — rubber dragging, not ringing
    scrubF=ctx.createBiquadFilter(); scrubF.type="lowpass"; scrubF.frequency.value=520;
    scrubG=ctx.createGain(); scrubG.gain.value=0;
    noiseSrc.connect(scrubF); scrubF.connect(scrubG); scrubG.connect(master);

    // real squeal wavers; a dead-steady pitch is the giveaway that it's synthetic
    lfo=ctx.createOscillator(); lfo.type="sine"; lfo.frequency.value=6.5;
    lfoG=ctx.createGain(); lfoG.gain.value=55;
    lfo.connect(lfoG); lfoG.connect(squealF.frequency); lfo.start();

    // boost air: sustained whoosh while the boost is burning
    airF=ctx.createBiquadFilter(); airF.type="lowpass"; airF.frequency.value=700;
    airG=ctx.createGain(); airG.gain.value=0;
    noiseSrc.connect(airF); airF.connect(airG); airG.connect(master);

    // off-track: continuous low rumble for as long as you're past the edge
    offF=ctx.createBiquadFilter(); offF.type="lowpass"; offF.frequency.value=380;
    offG=ctx.createGain(); offG.gain.value=0;
    noiseSrc.connect(offF); offF.connect(offG); offG.connect(master);

    noiseSrc.start();
    ready=true;
  }

  function tone(freq,dur,vol,type,slideTo,delay){
    if(!ready) return;
    const t=ctx.currentTime+(delay||0);
    const o=ctx.createOscillator(); o.type=type||"triangle";
    o.frequency.setValueAtTime(freq,t);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+dur+0.02);
  }

  return {
    unlock(){ init(); if(ctx&&ctx.state==="suspended") ctx.resume(); },
    // persistent nodes, parameters nudged — never build nodes per frame
    update(drift,speed,off,boosting){
      if(!ready) return;
      const t=ctx.currentTime;
      const slide=clamp((drift-0.12)/0.75,0,1)*clamp(speed/420,0,1);
      squealG.gain.setTargetAtTime(slide*0.377,t,0.05);
      harmG.gain.setTargetAtTime(slide*0.064,t,0.05);
      scrubG.gain.setTargetAtTime(slide*0.059,t,0.05);
      squealF.frequency.setTargetAtTime(780+drift*620,t,0.09);
      harmF.frequency.setTargetAtTime(1650+drift*900,t,0.09);
      offG.gain.setTargetAtTime(off?clamp(speed/480,0,1)*0.44:0,t,0.06);
      airG.gain.setTargetAtTime(boosting?0.083:0,t,0.09);
      airF.frequency.setTargetAtTime(boosting?1400:700,t,0.13);
    },
    limit(v){                                   // the moment you cross the edge
      if(!ready) return;
      const t=ctx.currentTime, vol=0.763*clamp(v,0.2,1);
      const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      const f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.value=420;
      const g=ctx.createGain();
      g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.20);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t+0.22);
    },
    boost(){                                    // ignition: soft low shove + bright burst
      if(!ready) return;
      // A pure sine has no harmonics, so none of it lands in the 300-1200Hz band
      // that made the sawtooth version buzz. Felt more than heard.
      // Kept above ~140Hz on purpose: a phone speaker can't move enough air below
      // that, and it distorts trying — which is heard as rasp, not bass.
      tone(280,0.16,0.13,"sine",150);
      const t=ctx.currentTime;
      const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
      // A swept bandpass reads as air moving past. Static highpassed noise is hiss.
      const f=ctx.createBiquadFilter(); f.type="bandpass"; f.Q.value=1.3;
      f.frequency.setValueAtTime(2600,t);
      f.frequency.exponentialRampToValueAtTime(700,t+0.26);
      const g=ctx.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.030,t+0.04);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
      s.connect(f); f.connect(g); g.connect(master);
      s.start(t); s.stop(t+0.28);
    },
    count(n){ n===0 ? tone(900,0.34,0.046,"triangle") : tone(440,0.12,0.083,"triangle"); },
    chainBreak(){                               // combo lost: falling two-tone
      tone(560,0.13,0.033,"square",330);
      tone(300,0.22,0.028,"square",150,0.11);
    },
    muted(){ return muted; },
    toggle(){
      muted=!muted;
      try{ localStorage.setItem("neondrift:mute",muted?"1":"0"); }catch(e){}
      if(master) master.gain.setTargetAtTime(muted?0:0.9,ctx.currentTime,0.05);
      return muted;
    },
    suspend(){ if(ctx&&ctx.state==="running") ctx.suspend(); },
    resume(){ if(ctx&&ctx.state==="suspended") ctx.resume(); }
  };
})();
document.addEventListener("visibilitychange",()=>{
  if(document.hidden) SFX.suspend(); else SFX.resume();
});
// ===== END SOUND ============================================================

// ---------- loop ----------
let last=performance.now(), acc=0;
const T_TICK=0.6, T_GO=0.45;   // 3-2-1 at 0.6s each, then GO fades over 0.45s
let cd=0, goT=0, frameDt=1/60;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25)dt=0.25;
  frameDt=dt;
  if(running){
    if(cd>0){
      // hold the car on the line: no physics, no clock, no ghost playback yet
      const prevTick=Math.ceil(cd/T_TICK);
      cd=Math.max(0,cd-dt);
      const nowTick=Math.ceil(cd/T_TICK);
      if(nowTick!==prevTick && nowTick>0) SFX.count(nowTick);
      if(cd===0){ goT=T_GO; acc=0; SFX.count(0); }
    } else {
      acc+=dt;
      while(acc>=1/120){ step(1/120); acc-=1/120; if(!running)break; }
    }
  }
  if(goT>0) goT=Math.max(0,goT-dt);
  countdownHud();
  // step() stops on finish, so car.* freezes at its last value — feed silence
  // instead of stale numbers, which also covers the countdown and start screen
  if(running && cd<=0) SFX.update(car.drift, Math.hypot(car.vx,car.vy), car.off, car.boosting);
  else SFX.update(0,0,false,false);
  draw(); hud();
}

const $cd=document.getElementById("countdown");
function countdownHud(){
  if(cd>0){
    const f=(cd%T_TICK)/T_TICK;                 // 1 just appeared, 0 about to flip
    $cd.textContent=Math.ceil(cd/T_TICK);
    $cd.className="";
    $cd.style.opacity=Math.min(1,f*2.4).toFixed(2);
    $cd.style.transform="translate(-50%,-50%) scale("+(1+0.45*f).toFixed(3)+")";
  } else if(goT>0){
    const f=goT/T_GO;
    $cd.textContent="GO";
    $cd.className="go";
    $cd.style.opacity=f.toFixed(2);
    $cd.style.transform="translate(-50%,-50%) scale("+(1.9-0.9*f).toFixed(3)+")";
  } else {
    $cd.style.opacity=0;
  }
}

function start(){
  resetCar(); acc=0; last=performance.now();
  cd=3*T_TICK; goT=0; SFX.count(3);
  $overlay.classList.add("gone");
  cam.x=car.x; cam.y=car.y; cam.a=camRot?(-car.a-Math.PI/2):0; camAV=0; camLX=0; camLY=0;
  running=true;
}

function finish(){
  running=false; finished=true;
  const prevBest = bestTime;            // capture before it's overwritten, or there's no delta to show
  const isPB = bestTime==null || time<bestTime;
  if(isPB){
    bestTime=time;
    ghost=rec;
    try{ localStorage.setItem(LS_BEST,String(time)); localStorage.setItem(LS_GHOST,JSON.stringify(rec)); }catch(e){}
  }
  let line;
  if(prevBest==null){
    line='<span class="note">First run on this track. Your ghost is saved.</span>';
  }else{
    const d=time-prevBest;
    line='<span class="'+(d<0?"faster":"slower")+'">'+(d<0?"−":"+")+Math.abs(d).toFixed(2)+'</span>'
       + '<span class="note"> '+(d<0?"on your best of "+fmt(prevBest):"off your best of "+fmt(prevBest))+'</span>';
  }
  $result.innerHTML='<span class="big'+(isPB?' pb':'')+'">'+fmt(time)+'</span>'+line;
  $go.textContent="RACE AGAIN";
  syncClear();
  $overlay.classList.remove("gone");
}

$go.addEventListener("click",e=>{e.stopPropagation();SFX.unlock();start()});
document.getElementById("restart").addEventListener("click",e=>{e.stopPropagation();SFX.unlock();start()});
const $gt=document.getElementById("guidetoggle");
if(!GUIDES_ENABLED) $gt.style.display="none";
$gt.addEventListener("click",e=>{
  e.stopPropagation(); guidesOn=!guidesOn;
  $gt.textContent="Guides: "+(guidesOn?"on":"off");
});
const $mute=document.getElementById("mute");
$mute.textContent="Sound: "+(SFX.muted()?"off":"on");
$mute.addEventListener("click",e=>{
  e.stopPropagation(); SFX.unlock();
  $mute.textContent="Sound: "+(SFX.toggle()?"off":"on");
});
const $cam=document.getElementById("camtoggle");
$cam.addEventListener("click",e=>{
  e.stopPropagation(); camRot=!camRot;
  $cam.textContent="Camera: "+(camRot?"chase":"fixed");
});

loadTrack(INITIAL_SEED);
resize(); resetCar(); cam.x=car.x; cam.y=car.y;

// ===== DEV PANEL SCRIPT START — delete with the dev panel =====
(()=>{
  const cb=document.getElementById("devGuides");
  const box=document.getElementById("devSeed");
  cb.checked=guidesOn;
  cb.addEventListener("change",()=>{
    guidesOn=cb.checked;
    $gt.textContent="Guides: "+(guidesOn?"on":"off");
  });
  function apply(seed){
    if(!seed) return;
    seedOverridden = (seed!==TODAY);
    loadTrack(seed);
    resetCar();
    cam.x=car.x; cam.y=car.y; cam.a=0; camAV=0; camLX=0; camLY=0;
    $result.innerHTML='<span class="note">Loaded track from seed "'+seed+'".</span>';
    $go.textContent="TAP TO RACE";
    box.value=seed;
  }
  document.getElementById("devLoad").addEventListener("click",e=>{
    e.stopPropagation(); apply(box.value.trim());
  });
  document.getElementById("devRandom").addEventListener("click",e=>{
    e.stopPropagation(); apply("rnd-"+Math.random().toString(36).slice(2,10));
  });
  box.addEventListener("keydown",e=>{
    e.stopPropagation();                       // don't let typing steer the car
    if(e.key==="Enter") apply(box.value.trim());
  });
  box.addEventListener("keyup",e=>e.stopPropagation());
  box.value=SEED_STR;
})();
// ===== DEV PANEL SCRIPT END =====
requestAnimationFrame(frame);
})();
</script>
